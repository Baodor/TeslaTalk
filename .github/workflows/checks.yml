name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    env:
      LIVEKIT_API_KEY: ci-only-key
      LIVEKIT_API_SECRET: ci-only-secret-not-for-production-aaaaaaaaaaaaaaaa
      TT_VOICE_TEST: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements-dev.txt
      - run: PYTHONPATH=backend pytest -q backend/tests
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Start isolated audio server
        run: |
          python - <<'PY'
          import os, pathlib, yaml
          config=yaml.safe_load(pathlib.Path('deploy/livekit.example.yaml').read_text())
          config['keys']={os.environ['LIVEKIT_API_KEY']:os.environ['LIVEKIT_API_SECRET']}
          config['rtc']['use_external_ip']=False
          config['rtc']['node_ip']='127.0.0.1'
          pathlib.Path('/tmp/livekit-ci.yaml').write_text(yaml.safe_dump(config))
          PY
          docker run -d --name tt-audio --network host -v /tmp/livekit-ci.yaml:/etc/livekit.yaml:ro livekit/livekit-server:v1.13.7 --config /etc/livekit.yaml
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - name: Build production container
        run: docker build -t teslatalk:check .
      - name: Logs on failure
        if: failure()
        run: docker logs tt-audio || true
