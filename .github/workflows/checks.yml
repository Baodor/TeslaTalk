name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    env:
      LIVEKIT_API_KEY: ci-only-key
      LIVEKIT_API_SECRET: ci-only-secret-not-for-production-aaaaaaaaaaaaaaaa
      TT_VOICE_TEST: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements-dev.txt
      - run: PYTHONPATH=backend pytest -q backend/tests
      - name: Validate Traefik configuration with and without a certificate resolver
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          path = pathlib.Path('.env')
          # Test-only public placeholders; never overwrite an existing environment.
          with path.open('x') as output:
              output.write(pathlib.Path('.env.example').read_text())
          try:
              for resolver in ('', 'ci-resolver'):
                  environment = dict(os.environ, TRAEFIK_CERT_RESOLVER=resolver)
                  command = ['docker', 'compose', '-f', 'compose.traefik.yaml', 'config', '--format', 'json']
                  configuration = json.loads(subprocess.check_output(command, env=environment))
                  for service, router in [('teslatalk', 'teslatalk'), ('livekit', 'teslatalk-voice')]:
                      labels = configuration['services'][service]['labels']
                      assert labels[f'traefik.http.routers.{router}.tls.certresolver'] == resolver
                      assert labels[f'traefik.http.routers.{router}.tls'] == 'true'
              environment = dict(os.environ, TESLA_COMMAND_PROXY_USER='1000:1000', TESLA_GROUP_CONTROLS='true')
              command = ['docker','compose','-f','compose.traefik.yaml','-f','compose.vehicle-controls.yaml','config','--format','json']
              configuration = json.loads(subprocess.check_output(command,env=environment))
              proxy = configuration['services']['tesla-command-proxy']
              assert proxy['user'] == '1000:1000' and not proxy.get('ports') and not proxy.get('labels')
              application = configuration['services']['teslatalk']['environment']
              assert application['TESLA_COMMAND_PROXY_URL'] == 'https://tesla-command-proxy:4443'
              assert application['TESLA_COMMAND_PROXY_CA'] == '/app/keys/vehicle-command-tls.pem'
          finally:
              path.unlink()
          print('Traefik TLS labels render correctly for both resolver settings.')
          PY
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Start and verify the private signed-command proxy without accessing cars
        run: |
          python - <<'PY'
          import importlib.util, os, pathlib, socket, ssl, subprocess, time
          root=pathlib.Path('/tmp/teslatalk-command-ci')
          keys=root/'deploy/keys'
          keys.mkdir(parents=True)
          subprocess.run(['openssl','ecparam','-name','prime256v1','-genkey','-noout','-out',str(keys/'tesla-private-key.pem')],check=True,capture_output=True)
          (keys/'tesla-private-key.pem').chmod(0o600)
          spec=importlib.util.spec_from_file_location('control_setup','scripts/configure_vehicle_controls.py')
          setup=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(setup)
          assert setup.prepare(root)
          context=ssl.create_default_context(cafile=str(keys/'vehicle-command-tls.pem'))
          subprocess.run(['docker','run','-d','--name','tt-command','--read-only','--security-opt=no-new-privileges:true',
                          '--user',f'{os.getuid()}:{os.getgid()}', '--workdir','/', '-v',f'{keys}:/keys:ro','-p','127.0.0.1:14443:4443',
                          'tesla/vehicle-command:latest','-tls-key','/keys/vehicle-command-tls-key.pem','-cert','/keys/vehicle-command-tls.pem',
                          '-key-file','/keys/tesla-private-key.pem','-host','0.0.0.0','-port','4443'],check=True)
          for attempt in range(30):
              try:
                  with socket.create_connection(('127.0.0.1',14443),timeout=2) as plain:
                      with context.wrap_socket(plain,server_hostname='tesla-command-proxy') as secure:
                          secure.sendall(b'GET /ci-health HTTP/1.1\r\nHost: tesla-command-proxy\r\nConnection: close\r\n\r\n')
                          response=secure.recv(1024)
                  assert response.startswith(b'HTTP/1.1 '), response[:100]
                  break
              except OSError:
                  time.sleep(1)
          else:raise SystemExit('Command proxy did not serve verified TLS')
          logs=subprocess.check_output(['docker','logs','tt-command'],stderr=subprocess.STDOUT,text=True)
          assert 'Could not get working directory' not in logs, logs
          print('Private command proxy starts with the key owner UID and verified TLS; no OAuth token or vehicle command used.')
          PY
      - name: Start isolated audio server
        run: |
          python - <<'PY'
          import os, pathlib, yaml
          config=yaml.safe_load(pathlib.Path('deploy/livekit.example.yaml').read_text())
          config['keys']={os.environ['LIVEKIT_API_KEY']:os.environ['LIVEKIT_API_SECRET']}
          config['rtc']['use_external_ip']=False
          config['rtc']['node_ip']='127.0.0.1'
          config['rtc']['enable_loopback_candidate']=True
          pathlib.Path('/tmp/livekit-ci.yaml').write_text(yaml.safe_dump(config))
          PY
          docker run -d --name tt-audio --network host -v /tmp/livekit-ci.yaml:/etc/livekit.yaml:ro livekit/livekit-server:v1.13.7 --config /etc/livekit.yaml
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - name: Build production container
        run: |
          # Reproduce checkouts created with a restrictive umask.
          chmod -R go-rwx backend/app frontend/public
          docker build -t teslatalk:check .
      - name: Start production container as its application user
        run: |
          docker run -d --name tt-app \
            -e APP_SECRET=ci-only-startup-secret-aaaaaaaaaaaaaaaaaaaaaaaa \
            -e APP_URL=http://localhost:8780 \
            --mount type=volume,source=teslatalk-ci-data,target=/data \
            -p 127.0.0.1:18780:8780 teslatalk:check
          python - <<'PY'
          import json, re, subprocess, time, urllib.request
          base = 'http://127.0.0.1:18780'
          for attempt in range(40):
              state = json.loads(subprocess.check_output(['docker', 'inspect', 'tt-app']))[0]['State']
              if not state['Running']:
                  raise SystemExit(f"Production container stopped: {state['ExitCode']}")
              try:
                  with urllib.request.urlopen(base + '/api/health', timeout=2) as response:
                      health = json.load(response)
              except OSError:
                  time.sleep(1)
                  continue
              assert health['status'] == 'ok', health
              break
          else:
              raise SystemExit('Production container did not become ready')
          with urllib.request.urlopen(base + '/', timeout=5) as response:
              page = response.read().decode()
          assert 'TeslaTalk' in page
          assets = re.findall(r'(?:src|href)="(/assets/[^\"]+)"', page)
          assert assets, 'Frontend assets missing from index.html'
          for path in assets + ['/favicon.svg','/favicon.ico','/favicon-32-v6.png','/favicon-64-v6.png']:
              with urllib.request.urlopen(base + path, timeout=5) as response:
                  assert response.status == 200 and response.read(), path
          print('Production HTTP, SQLite volume and frontend assets are accessible.')
          PY
          docker exec tt-app python -c 'import os; assert os.getuid() == 10001, os.getuid(); print("Application UID:", os.getuid())'
      - name: Logs on failure
        if: failure()
        run: |
          docker logs tt-audio || true
          docker logs tt-app || true
          docker logs tt-command || true
          find frontend/test-results -name error-context.md -exec cat {} \; || true
