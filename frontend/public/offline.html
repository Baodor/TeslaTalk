<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#101a20">
    <meta name="apple-mobile-web-app-title" content="TeslaTalk">
    <title>TeslaTalk · Offline</title>
    <link rel="stylesheet" href="/offline.css">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/favicon.ico?v=6" sizes="any">
    <link rel="icon" href="/favicon-32-v6.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v4.png">
    <script src="/viewport.js" defer></script>
    <script src="/offline.js" defer></script>
  </head>
  <body><main>
    <a class="brand-logo" href="/" aria-label="TeslaTalk – Startseite"><img src="/favicon.svg" alt="TeslaTalk"></a>
    <h1 id="offline-title">Die Verbindung fehlt.</h1>
    <p id="offline-description">Dein Browser kann den TeslaTalk-Server gerade nicht erreichen. Fahrten, Karte, Sprachfunk und neue Nachrichten sind verfügbar, sobald die Verbindung wieder steht.</p>
    <a id="reconnect" href="/">Erneut verbinden</a>
    <p id="status" role="status" aria-live="polite"></p>
    <details class="offline-settings"><summary id="settings-label">Einstellungen</summary>
    <label for="offline-language" id="language-label">Sprache</label>
    <select id="offline-language"><option value="auto">Automatisch</option><option value="de">Deutsch</option><option value="en">English</option><option value="nl">Nederlands</option></select>
    </details>
  </main></body>
</html>
